version: "3.8"

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: cartify123
      MYSQL_DATABASE: cartify
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcartify123"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://root:cartify123@db:3306/cartify
      SECRET_KEY: cartify_secret_key_2025
      FRONTEND_URL: http://localhost:4000
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./client
    ports:
      - "4000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads:
